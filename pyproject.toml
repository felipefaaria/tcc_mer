[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-mer"
version = "0.1.0"
description = "Valência-arousal e dissociação áudio-letra em música brasileira (TCC II, PUC Minas)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Felipe Silva Faria" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Rotulagem da letra com o LLM (LF2).
llm = ["anthropic>=1.0", "python-dotenv>=1.0"]
# Léxico ANEW-Br (fonte descartada; só para reproduzir a comparação com o LLM).
lexicon = ["spacy>=3.7"]
# Coleta do corpus (Genius, Deezer, iTunes, YouTube).
collection = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "imageio-ffmpeg>=0.4",
    "yt-dlp>=2024.1",
]
# Gold set e experimento com ouvintes.
validation = [
    "krippendorff>=0.6",
    "openpyxl>=3.1",
    "demucs>=4.0",
    "torch>=2.0",
    "imageio-ffmpeg>=0.4",
]
# Ferramentas de desenvolvimento e o necessário para rodar a suíte inteira.
dev = [
    "pytest>=7",
    "ruff>=0.5",
    "krippendorff>=0.6",
    "openpyxl>=3.1",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["tcc_mer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PIE"]
ignore = [
    "B905",  # zip(strict=...) é pedante demais para pares de colunas de mesmo tamanho
]

[tool.ruff.lint.isort]
known-first-party = ["tcc_mer"]
